<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ agent_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css').path }}?v=1">
  </head>
  <body>
    <main class="shell">
      <header class="ribbon">
        <p class="kicker">Cyber Operations analysis</p>
        <h1>{{ agent_name }}</h1>
      </header>
      <section id="messages" class="messages" aria-live="polite"></section>
      <form id="chat-form" class="composer">
        <div class="composer-heading">
          <label for="message">Your analysis</label>
          <span>Up to 4,000 characters</span>
        </div>
        <p id="status" role="status"></p>
        <textarea id="message" rows="5" maxlength="4000" required placeholder="Choose an analysis below, replace any [PLACEHOLDER], then press Send."></textarea>
        <div class="actions">
          <p>Enter sends. Shift+Enter adds a line.</p>
          <button type="submit">Send</button>
        </div>
        <div class="starters">
          <p>A click fills the box. It does not send.</p>
          <div id="starter-list" class="suggestions"></div>
        </div>
      </form>
    </main>
    <script id="welcome-data" type="application/json">{{ welcome | tojson }}</script>
    <script src="{{ url_for('static', path='/app.js').path }}?v=1"></script>
  </body>
</html>
